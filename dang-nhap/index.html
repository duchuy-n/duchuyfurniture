<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập quản trị | Nội thất Đức Huy</title>
    <meta name="description" content="Đăng nhập khu quản trị Nội thất Đức Huy.">
    <meta name="robots" content="noindex, nofollow">
    <link rel="canonical" href="https://duchuyfurniture.vercel.app/dang-nhap/">
    <link rel="icon" href="../assets/images/logo-theone.jpg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../styles.css">
  </head>
  <body class="login-page simple-login-page">
    <main class="login-main simple-login-main">
      <form class="login-card simple-login-card" id="adminLoginForm" novalidate>
        <a class="simple-login-logo" href="../" aria-label="Về trang chủ Nội thất Đức Huy">
          <img src="../assets/images/logo-theone.jpg" alt="Logo The One">
        </a>

        <div class="login-card-heading simple-login-heading">
          <strong>Đăng nhập quản trị</strong>
          <span>Nội thất Đức Huy</span>
        </div>

        <label class="form-field" for="loginIdentity">
          <span>Tài khoản</span>
          <input id="loginIdentity" name="identity" type="text" autocomplete="username" placeholder="Nhập tài khoản">
        </label>

        <label class="form-field" for="loginPassword">
          <span>Mật khẩu</span>
          <div class="password-field">
            <input id="loginPassword" name="password" type="password" autocomplete="current-password" placeholder="Nhập mật khẩu">
            <button type="button" id="togglePassword" aria-label="Hiện mật khẩu">Hiện</button>
          </div>
        </label>

        <button class="btn primary login-submit" type="submit">Đăng nhập</button>
        <p class="login-message" id="loginMessage" role="status" aria-live="polite"></p>
      </form>
    </main>

    <script src="login.js"></script>
  </body>
</html>
